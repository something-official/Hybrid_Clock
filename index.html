<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hybrid Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="clock-container">
    <div class="clock">
      <div id="center"></div>
      <div class="line hour-line" id="hour-line"></div>
      <div class="line minute-line" id="minute-line"></div>
      <div class="line second-line" id="second-line"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
